function hasFilledValue(value) {
  if (value === true || value === false) return true;
  return String(value == null ? '' : value).trim() !== '';
}

function isTradeStepComplete(anchor, form) {
  var fields = STEP_REQUIRED_FIELDS[anchor] || [];
  if (!fields.length) return false;
  var complete = fields.every(function(field) { return hasFilledValue(form[field]); });
  if (anchor === 'section-settlement') {
    complete = complete && (hasFilledValue(form.netAmount) || (hasFilledValue(form.amount) && hasFilledValue(form.fee)));
  }
  return complete;
}

function getFieldFocusTarget(field) {
  if (!field) return null;
  if (field.matches && field.matches('input:not([readonly]), textarea:not([readonly]), button:not([disabled]), [tabindex]:not([tabindex="-1"])')) {
    return field;
  }
  return field.querySelector('input:not([readonly]), textarea:not([readonly]), button:not([disabled]), [tabindex]:not([tabindex="-1"])');
}

function focusFirstEmptyFieldInStep(anchor) {
  var section = document.getElementById(anchor);
  if (!section) return false;
  var field = section.querySelector('[data-stepper-field][data-stepper-empty="true"]') ||
    section.querySelector('[data-stepper-field]');
  var target = getFieldFocusTarget(field);
  if (!target || typeof target.focus !== 'function') return false;
  target.focus({ preventScroll: true });
  return true;
}

function inferInstrumentType(label) {
  const value = String(label || '').toUpperCase();
  if (value.includes('TBILL')) return 'T-Bills';
  if (value.includes('UDIBONO')) return 'UDIBONO';
  if (value.includes('BONO')) return 'BONOS';
  return 'CETES';
}

function deriveLegacyTicketNumber(value) {
  var mapped = LEGACY_TICKET_MAP[value];
  if (mapped) return mapped;
  var digits = String(value || '').match(/(\d{3,})$/);
  if (digits) return digits[1];
  return String(value || '');
}

function normalizeTicketValue(ticket) {
  if (ticket == null) return '';
  var raw = String(ticket);
  if (/^\d+$/.test(raw)) return raw;
  if (raw.indexOf('BI_') === 0) return deriveLegacyTicketNumber(raw);
  return raw;
}

function normalizeDateString(value) {
  var raw = String(value || '').trim();
  if (!raw || raw === '—') return raw;
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  var legacyMatch = raw.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (legacyMatch) return legacyMatch[3] + '-' + legacyMatch[2] + '-' + legacyMatch[1];
  return raw;
}

function getTermDayOffset(term) {
  var match = String(term || '').trim().match(/^T\+(\d+)$/);
  return match ? Number(match[1]) : null;
}

function addDaysToIsoDate(isoDate, days) {
  var match = String(isoDate || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match || !Number.isFinite(days)) return '';
  var year = Number(match[1]);
  var month = Number(match[2]);
  var day = Number(match[3]);
  var date = new Date(Date.UTC(year, month - 1, day));
  if (
    date.getUTCFullYear() !== year ||
    date.getUTCMonth() !== month - 1 ||
    date.getUTCDate() !== day
  ) return '';
  date.setUTCDate(date.getUTCDate() + days);
  return [
    String(date.getUTCFullYear()),
    String(date.getUTCMonth() + 1).padStart(2, '0'),
    String(date.getUTCDate()).padStart(2, '0'),
  ].join('-');
}

function calculateSettlementDate(tradeDate, term) {
  var offset = getTermDayOffset(term);
  if (offset === null) return '';
  return addDaysToIsoDate(tradeDate, offset);
}

function normalizeAuthorName(value) {

function formatToday() {
  const now = new Date();
  const yyyy = String(now.getFullYear());
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  return yyyy + '-' + mm + '-' + dd;
}

function formatTicketDate() {
  const now = new Date();
  const yy = String(now.getFullYear()).slice(-2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  return yy + mm + dd;
}

function formatMoney(value) {
  const numeric = Number(String(value || '0').replace(/,/g, ''));
  if (!Number.isFinite(numeric)) return '0';
  return numeric.toLocaleString('en-US');
}

function normalizeMxnLabel(value) {
  var raw = String(value || '').trim();
  if (!raw) return '';
  if (raw.indexOf('MXN ') === 0) return raw;
  if (raw.indexOf('MXN') === 0) return 'MXN ' + raw.slice(3).trim();
  if (raw.indexOf('$') === 0) return 'MXN ' + raw.slice(1).trim();
  return raw;
}

function stripMxnLabel(value) {
  var raw = String(value || '').trim();
  if (!raw) return '';
  if (raw.indexOf('$') === 0) return raw.slice(1).trim();
  if (raw.indexOf('USD') === 0) return raw.slice(3).trim();
  if (raw.indexOf('MXN ') === 0) return raw.slice(4).trim();
  if (raw.indexOf('MXN') === 0) return raw.slice(3).trim();
  return raw;
}

function formatMxnDisplay(value, currency = 'MXN') {
  var raw = String(value || '').trim();
  if (!raw) return '';
  return currency + ' ' + stripMxnLabel(raw);
}

  const instrumentOptions = Array.from(new Set(INSTRUMENT_OPTIONS.concat(SecurityTradeData.tbills, currentTrades.map(row => row.instrumentCode).filter(Boolean))));
  const selectableInstruments = form.tradeType === 'sell'
    ? instrumentOptions.filter(code => inventory.positions.some(row => row.instrument === code && row.open > 0 && (!form.portfolioId || row.portfolioId === form.portfolioId)))
    : instrumentOptions;
  const [flashKeys, setFlashKeys] = React.useState({});
  const [activeStepAnchor, setActiveStepAnchor] = React.useState(BASE_STEPS[0].anchor);
  const scrollRef = React.useRef(null);
  const scrollTarget = React.useRef(null);
  const savedTop = React.useRef(null);
  const savingTrade = React.useRef(false);

  React.useLayoutEffect(() => {
    const container = scrollRef.current;
    if (!container) return;
    if (savedTop.current !== null) {
      container.scrollTop = savedTop.current;
      savedTop.current = null;
    }
    if (scrollTarget.current) {
      const targetAnchor = scrollTarget.current;
      const el = document.getElementById(targetAnchor);
      if (el) {
        const elRect = el.getBoundingClientRect();
        const contRect = container.getBoundingClientRect();
        const nextTop = Math.max(0, container.scrollTop + (elRect.top - contRect.top) - 8);
        container.scrollTo({ top: nextTop, behavior: 'smooth' });
      }
      scrollTarget.current = null;
      window.setTimeout(function() {
        focusFirstEmptyFieldInStep(targetAnchor);
      }, 80);
    }
  });

  function setMode(nextMode, nextStatus) {
    savedTop.current = 0;
    if (nextMode === 'settlement_form') {
      setForm(function(prev) {
        if (String(prev.currency || '').trim()) return prev;
        return { ...prev, currency: SecurityTradeData.instrumentInfo(prev.instrument).currency };
      });
    }
    setModeState(nextMode);
    if (nextStatus) setTradeStatus(nextStatus);
    const url = new URL(window.location.href);
    url.searchParams.set('mode', nextMode);
    url.searchParams.set('status', nextStatus || tradeStatus);
    window.history.replaceState({}, '', url.toString());
  }

  function onBack() {
    window.location.href = 'Security Trades.html';
  }

  function updateField(key, value) {
    setFormError('');
    setForm(function(prev) {
      var next = { ...prev, [key]: value };
      if (key === 'portfolioId') {
        var portfolio = portfolios.find(item => item.id === value);
        next.portfolioName = portfolio ? portfolio.name : '';
        next.book = portfolio ? portfolio.book : '';
      }
      if (key === 'tradeDate' || key === 'term') {
        if (getTermDayOffset(next.term) !== null) {
          var calculatedSettlementDate = calculateSettlementDate(next.tradeDate, next.term);
          next.settlementDate = calculatedSettlementDate || '';
        }
      }
      if (['instrument', 'rate', 'tradeDate', 'term'].includes(key)) {
        next.price = SecurityTradeData.calculatePrice(next);
      }
      if (key === 'instrument') {
        next.instrumentType = inferInstrumentType(value);
        if (next.currency) next.currency = SecurityTradeData.instrumentInfo(value).currency;
      }
      return next;
    });
  }

  function generateTradeTicket() {
    var max = Number(TRADE_TICKET);
    loadSavedTrades().forEach(function(row) {
      var value = Number(normalizeTicketValue(row.ticket));
      if (Number.isFinite(value) && value > max) max = value;
    });
    Object.keys(LEGACY_TICKET_MAP).forEach(function(key) {
      var value = Number(LEGACY_TICKET_MAP[key]);
      if (Number.isFinite(value) && value > max) max = value;
    });
    return String(max + 1);
  }

  function buildInstrumentLabel() {
    return form.instrument || initialContext.instrumentCode || initialContext.instrumentLabel || '—';
  }

function buildTradeRow(statusValue, modeValue, readonlyValue) {
    const tradeTicket = initialContext.ticket || generateTradeTicket();
    const totalValue = hasAmountInputs
      ? formatMoney(Number(String(form.quantity).replace(/,/g, '')) * Number(String(form.price || '0').replace(/,/g, '')))
      : '';
    const reviewComment = (
      statusValue === 'returned_to_fo' ||
      statusValue === 'returned_to_bo' ||
      statusValue === 'declined'
    ) ? String(form.comment || '').trim() : (form.reviewComment || '');
    const reviewerName =
      mode === 'approval_detail' || mode === 'mo_reconciliation_detail' || mode === 'mo_reconciliation_review'
        ? 'Alejandro Hernández'
        : mode === 'bo_approval_detail' || mode === 'bo_approval_review' || mode === 'mo_settlement_confirmation_detail'
          ? 'Lucía Ramírez'
          : (form.reviewedBy || '');
    const reviewedAt = (
      statusValue === 'returned_to_fo' ||
      statusValue === 'returned_to_bo' ||
      statusValue === 'declined'
    ) ? formatToday() : (form.reviewedAt || '');

    const boundForm = SecurityTradeData.bind({ details: form, portfolioId: form.portfolioId }, PortfolioStore.list());
    return {
      ticket: tradeTicket,
      instrument: buildInstrumentLabel(),
      portfolioId: boundForm.portfolioId,
      portfolioName: boundForm.portfolioName,
      counterpartyTrader: form.counterpartyTrader,
      rate: form.rate,
      counterparty: form.counterparty || initialContext.counterparty || '—',
      type: form.tradeType || initialContext.type || 'buy',
      price: form.price || '',
      qty: form.quantity || '',
      total: totalValue || '—',
      status: statusValue,
      mode: modeValue,
      readonly: !!readonlyValue,
      created: initialContext.created || formatToday(),
      author: initialContext.author || DEFAULT_AUTHOR,
      instrumentCode: form.instrument || initialContext.instrumentCode || '',
      contract: form.contract || '—',
      custodian: form.custodian || '—',
      tradeDate: form.tradeDate || initialContext.created || formatToday(),
      settlementDate: form.settlementDate || initialContext.created || formatToday(),
      term: form.term || 'T+1',
      book: boundForm.book,
      strategy: form.strategy || 'Available for Sale (AFS)',
      ytm: form.rate ? form.rate + '%' : '',
      maturityDate: form.instrument ? ('20' + String(form.instrument).split('_').pop().slice(0, 2) + '-' + String(form.instrument).split('_').pop().slice(2, 4) + '-' + String(form.instrument).split('_').pop().slice(4, 6)) : (initialContext.created || formatToday()),
      interestAccrued1Day: '0',
      totalInterestAccrued: '0',
      realizedPnL: '0',
      details: {
        ...form,
        portfolioId: boundForm.portfolioId,
        portfolioName: boundForm.portfolioName,
        book: boundForm.book,
        reviewComment: reviewComment,
        reviewedBy: reviewerName,
        reviewedAt: reviewedAt,
      },
    };
  }

  async function persistTradeAndReturn(statusValue, modeValue, readonlyValue) {
    if (savingTrade.current) return;
    if ((mode === 'edit' || mode === 'review') && !validateTrade(statusValue !== 'draft')) return;
    savingTrade.current = true;
    try {
      await TradeStore.transact(() => buildTradeRow(statusValue, modeValue, readonlyValue));
      window.location.href = 'Security Trades.html';
    } catch (error) { savingTrade.current = false; setFormError(error.message); }
  }

  async function persistTradeAndContinue(statusValue, modeValue, readonlyValue) {
    if (savingTrade.current) return;
    savingTrade.current = true;
    try {
      await TradeStore.transact(() => buildTradeRow(statusValue, modeValue, readonlyValue));
      setMode(modeValue, statusValue);
    } catch (error) { setFormError(error.message); }
    finally { savingTrade.current = false; }
  }

  function validateTrade(complete) {
    const portfolio = PortfolioStore.find(form.portfolioId);
    let anchor = 'section-main-info';
    let message = '';
    if (!portfolio || !SecurityTradeData.eligible(portfolio, form.tradeType)) {
      message = 'Select an available portfolio for this trade.';
    } else if (complete) {
      anchor = BASE_STEPS.map(step => step.anchor).find(section =>
        STEP_REQUIRED_FIELDS[section].some(key => !String(form[key] ?? '').trim()));
      if (anchor) message = anchor === 'section-how-much' && !form.price && form.rate
        ? 'Check the instrument, rate and dates. Settlement date must not be after instrument maturity.'
        : 'Complete the required fields before continuing.';
    }
    if (!message && String(form.quantity || '').trim()) {
      const quantity = Number(String(form.quantity).replace(/,/g, ''));
      if (!Number.isSafeInteger(quantity) || quantity <= 0) message = 'Quantity must be a positive whole number.';
      else if (form.tradeType === 'sell') {
        try {
          HoldingsLedger.prepare({ ticket: initialContext.ticket || 'preview', type: 'sell', portfolioId: form.portfolioId,
            instrument: form.instrument, instrumentCode: form.instrument, qty: form.quantity, status: 'draft', details: { ...form } }, TradeStore.list());
        } catch (error) { message = error.message; }
      }
      if (message) anchor = 'section-how-much';
    }
    setFormError(message);
    if (message) handleStepClick(anchor);
    return !message;
  }

  function requireComment(message) {
    if (!String(form.comment || '').trim()) {
      window.alert(message || 'Enter comment');
      return false;
    }
    return true;
  }

  function returnToFo() {
    if (!requireComment('Enter comment')) return;
    persistTradeAndReturn('returned_to_fo', 'edit', false);
  }

  function returnToBo() {
    if (!requireComment('Enter comment')) return;
    persistTradeAndReturn('returned_to_bo', 'settlement_form', false);
  }

  function handleStepClick(anchor) {
    if (scrollRef.current) savedTop.current = scrollRef.current.scrollTop;
    setActiveStepAnchor(anchor);
    scrollTarget.current = anchor;
    setFlashKeys((prev) => ({ ...prev, [anchor]: (prev[anchor] || 0) + 1 }));
  }

  const hasAmountInputs = Boolean(String(form.quantity || '').trim()) && Boolean(String(form.price || '').trim());
  const sumLabel = hasAmountInputs
    ? instrumentInfo.currency + ' ' + formatMoney(Number(String(form.quantity).replace(/,/g, '')) * Number(String(form.price || '0').replace(/,/g, '')))
    : '';
  const tradeTypeBadge = <TradeTypeBadge value={form.tradeType} />;

  const mainInfoRows = [
    { label: 'Trade type', value: tradeTypeBadge },
    { label: 'Instrument', value: form.instrument },
    { label: 'Portfolio', value: portfolios.find(item => item.id === form.portfolioId)?.name || form.portfolioName || '—' },
    { label: 'Counterparty', value: form.counterparty },
    { label: 'Counterparty trader', value: form.counterpartyTrader || '—' },
    { label: 'Custodian', value: form.custodian },
    { label: 'Execution method', value: form.executionMethod },
  ];
  const whenRows = [
    { label: 'Trade date', value: form.tradeDate },
    { label: 'Trade time', value: form.tradeTime || '—' },
    { label: 'Term', value: form.term },
    { label: 'Settlement date', value: form.settlementDate },
  ];
  const howMuchRows = [
    { label: 'Quantity', value: form.quantity || '—' },
    { label: 'Rate', value: form.rate ? form.rate + '%' : '—' },
    { label: 'Price', value: form.price ? instrumentInfo.currency + ' ' + form.price : '—' },
    { label: 'Sum', value: hasAmountInputs ? sumLabel : '—' },
  ];
  const accountingRows = [
    { label: 'Strategy', value: form.strategy || '—' },
  ];
  const counterpartyRows = [
    { label: 'Confirmation number', value: form.confirmationNumber || '—' },
    { label: 'Contact person', value: form.contactPerson || '—' },
    { label: 'Confirmation date & time', value: form.confirmationDate || form.confirmationTime ? `${form.confirmationDate || '—'} · ${form.confirmationTime || '—'}` : '—' },
    { label: 'Confirmation method', value: form.confirmationMethod || '—' },
    { label: 'Matching result', value: form.matchState === 'mismatch' ? 'Mismatch found' : 'Details matched' },
  ];
  const counterpartyCommentRows = [
    { label: 'Comment', value: form.comment || '—' },
  ];
  const settlementRows = [
    { label: 'Bank reference', value: form.bankReference || '—' },
    { label: 'Settlement account', value: form.settlementAccount || '—' },
    { label: 'Settlement date', value: form.settlementDateFinal || '—' },
    { label: 'Amount', value: formatMxnDisplay(form.amount, form.currency || instrumentInfo.currency) || '—' },
    { label: 'Currency', value: form.currency || '—' },
    { label: 'Fee', value: formatMxnDisplay(form.fee, form.currency || instrumentInfo.currency) || '—' },
    { label: 'Net amount', value: formatMxnDisplay(form.netAmount, form.currency || instrumentInfo.currency) || '—' },
    { label: 'Custodian reference', value: form.custodianReference || '—' },
  ];
  const moReconciliationRows = [
    { label: 'Confirmation reference', value: form.moConfirmationReference || '—' },
    { label: 'Confirmation date & time', value: form.moConfirmationDateTime || '—' },
    { label: 'Matching result', value: form.moDetailsMatch ? 'Details match' : 'Mismatch found' },
  ];
  const moReconciliationCommentRows = [
    { label: 'Comment', value: form.comment || '—' },
  ];
  const boApprovalRows = [
    { label: 'Custodian statement reference', value: form.moCustodianStatementReference || '—' },
    { label: 'Statement result', value: form.moStatementMatch ? 'Statement matches' : 'Mismatch found' },
  ].concat(form.moStatementMatch ? [] : [
    { label: 'Discrepancy notes', value: form.moSettlementDiscrepancyNotes || '—' },
  ]);
  const boApprovalCommentRows = [
    { label: 'Comment', value: form.comment || '—' },
  ];
  const workflowNote =
    tradeStatus === 'returned_to_bo'
      ? ''
      : tradeStatus === 'returned_to_fo'
        ? ''
        : '';
  const reviewerComment = form.reviewComment || (
    tradeStatus === 'returned_to_fo' ||
    tradeStatus === 'returned_to_bo' ||
    tradeStatus === 'declined'
      ? form.comment
      : ''
  );
  const showReviewerCommentTile =
    (
      tradeStatus === 'returned_to_fo' ||
      tradeStatus === 'returned_to_bo' ||
      tradeStatus === 'declined'
    ) && Boolean(String(reviewerComment || '').trim());

  const hasRightColumn =
    mode === 'approval_detail' ||
    mode === 'mo_reconciliation_detail' || mode === 'mo_reconciliation_review' ||
    mode === 'counterparty_form' ||
    mode === 'counterparty_review' ||
    mode === 'settlement_form' ||
    mode === 'settlement_review' ||
    mode === 'bo_approval_detail' ||
    mode === 'bo_approval_review' ||
    mode === 'mo_settlement_confirmation_detail' ||
    showReviewerCommentTile;
  const showCounterpartyTile =
    mode === 'settlement_form' ||
    mode === 'settlement_review' ||
    mode === 'bo_approval_detail' ||
    mode === 'bo_approval_review' ||
    mode === 'mo_settlement_confirmation_detail' ||
    mode === 'settled_detail' ||
    tradeStatus === 'counterparty_confirmed' ||
    tradeStatus === 'settling' ||
    tradeStatus === 'pending_mo_settlement_confirmation' ||
    tradeStatus === 'returned_to_bo' ||
    tradeStatus === 'settled';
  const showSettlementTile =
    mode === 'bo_approval_detail' ||
    mode === 'bo_approval_review' ||
    mode === 'mo_settlement_confirmation_detail' ||
    mode === 'settled_detail' ||
    tradeStatus === 'settling' ||
    tradeStatus === 'pending_mo_settlement_confirmation' ||
    tradeStatus === 'returned_to_bo' ||
    tradeStatus === 'settled';
  const steps = React.useMemo(function() {
    const next = BASE_STEPS.slice();
    if (showCounterpartyTile) next.push({ label: 'Counterparty', anchor: 'section-counterparty' });
    if (showSettlementTile) next.push({ label: 'Settlement', anchor: 'section-settlement' });
    return next;
  }, [showCounterpartyTile, showSettlementTile]);
  const stepperSteps = React.useMemo(function() {
    return steps.map(function(step) {
      return Object.assign({}, step, {
        completed: isTradeStepComplete(step.anchor, form),
      });
    });
  }, [steps, form]);

  React.useEffect(function() {
    if (!steps.some(function(step) { return step.anchor === activeStepAnchor; })) {
      setActiveStepAnchor(steps[0] ? steps[0].anchor : BASE_STEPS[0].anchor);
    }
  }, [steps, activeStepAnchor]);

  React.useEffect(function() {
    function handleFocusIn(event) {
      var target = event.target;
      if (!target || !target.closest) return;
      var matchedStep = steps.find(function(step) {
        var section = document.getElementById(step.anchor);
        return section && section.contains(target);
      });
      if (matchedStep) setActiveStepAnchor(matchedStep.anchor);
    }
    document.addEventListener('focusin', handleFocusIn);
    return function() {
      document.removeEventListener('focusin', handleFocusIn);
    };
  }, [steps]);

  const title = initialContext.ticket
    ? initialContext.ticket
    : (mode === 'edit' || mode === 'review' ? 'New trade' : TRADE_TICKET);
  const status = STATUS_LABELS[tradeStatus] || 'Draft';
  const statusVariant = STATUS_VARIANTS[tradeStatus] || 'neutral-secondary';
  const headerActions = null;

  const editSections = (
    <SecurityTradeForm flashKeys={flashKeys} form={form} updateField={updateField} INSTRUMENT_OPTIONS={selectableInstruments} COUNTERPARTY_OPTIONS={COUNTERPARTY_OPTIONS} PORTFOLIO_OPTIONS={portfolioOptions} CUSTODIAN_OPTIONS={CUSTODIAN_OPTIONS} EXECUTION_METHOD_OPTIONS={EXECUTION_METHOD_OPTIONS} TERM_OPTIONS={TERM_OPTIONS} hasAmountInputs={hasAmountInputs} formatMoney={formatMoney} STRATEGY_OPTIONS={STRATEGY_OPTIONS} availableQuantity={availableQuantity} instrumentCurrency={instrumentInfo.currency} instrumentNominal={instrumentInfo.nominal} />
  );

  const reviewSections = (
    <SecurityTradeReview mainInfoRows={mainInfoRows} flashKeys={flashKeys} whenRows={whenRows} howMuchRows={howMuchRows} accountingRows={accountingRows} />
  );

  const previewSectionItems = React.useMemo(function() {
    const items = [];
    if (formError) items.push(<WorkflowNote key="form-error" text={formError} />);
    if (workflowNote) {
      items.push(<WorkflowNote key="workflow-note" text={workflowNote} />);
    }
    items.push(
      <ViewSection key="preview-main-info" id="section-main-info" title="Main info" rows={mainInfoRows} flashKey={flashKeys['section-main-info']} />,
      <ViewSection key="preview-when" id="section-when" title="When" rows={whenRows} flashKey={flashKeys['section-when']} />
    );

    const isPendingSettlementFlow =
      mode === 'counterparty_form' ||
      mode === 'counterparty_review' ||
      tradeStatus === 'pending_settlement';
    const isCounterpartyConfirmedFlow =
      mode === 'settlement_form' ||
      mode === 'settlement_review' ||
      tradeStatus === 'counterparty_confirmed';
    const isFinalSettlementFlow =
      mode === 'bo_approval_detail' ||
      mode === 'bo_approval_review' ||
      mode === 'mo_settlement_confirmation_detail' ||
      mode === 'settled_detail' ||
      tradeStatus === 'settling' ||
      tradeStatus === 'pending_mo_settlement_confirmation' ||
      tradeStatus === 'returned_to_bo' ||
      tradeStatus === 'settled';

    items.push(
        <ViewSection
          key="preview-how-much"
          id="section-how-much"
          title="How much"
          rows={howMuchRows}
          flashKey={flashKeys['section-how-much']}
        />
      );
    items.push(
      <ViewSection
        key="preview-accounting"
        id="section-accounting"
        title="Accounting"
        rows={accountingRows}
        flashKey={flashKeys['section-accounting']}
      />
    );

    if (isCounterpartyConfirmedFlow || isFinalSettlementFlow) {
      items.push(
        <ViewSection
          key="preview-counterparty"
          id="section-counterparty"
          title="Counterparty"
          rows={[].concat(counterpartyRows, counterpartyCommentRows)}
          flashKey={flashKeys['section-counterparty']}
        />
      );
    }

    if (isFinalSettlementFlow) {
      items.push(
        <ViewSection
          key="preview-settlement"
          id="section-settlement"
          title="Settlement"
          rows={[].concat(settlementRows, counterpartyCommentRows)}
          flashKey={flashKeys['section-settlement']}
        />
      );
    }

    return items;
  }, [
    mode,
    formError,
    tradeStatus,
    workflowNote,
    mainInfoRows,
    whenRows,
    howMuchRows,
    accountingRows,
    flashKeys,
    counterpartyRows,
    counterpartyCommentRows,
    settlementRows,
  ]);

  const middleSections = mode === 'edit'
    ? <>{formError ? <WorkflowNote text={formError} /> : null}{workflowNote ? <WorkflowNote text={workflowNote} /> : null}{editSections}</>
    : mode === 'review'
      ? <>{formError ? <WorkflowNote text={formError} /> : null}{workflowNote ? <WorkflowNote text={workflowNote} /> : null}{reviewSections}</>
      : previewSectionItems;

  const middleFillMode =
    mode === 'review'
      ? 'stretch-last'
      : 'filler-after-last';
  const middleButtons = mode === 'edit'
    ? <ButtonStack secondary={{ label: 'Save draft', variant: 'secondary', onClick: () => persistTradeAndReturn('draft', 'edit', false) }} primary={{ label: 'Continue', variant: 'primary', onClick: () => { if (validateTrade(true)) setMode('review'); } }} />
    : mode === 'review'
      ? <ButtonStack secondary={{ label: 'Back to edit', variant: 'secondary', onClick: () => setMode('edit', 'draft') }} primary={{ label: 'Submit for approval', variant: 'primary', onClick: () => persistTradeAndReturn('pending_approval', 'approval_detail', false) }} />
      : null;

  function rejectSettlement() {
    returnToBo();
  }

  var rightColumn = null;
  if (mode === 'approval_detail') {
    rightColumn = (
      <TradeApprovalPanel form={form} updateField={updateField} returnToFo={returnToFo} persistTradeAndReturn={persistTradeAndReturn} />
    );
  } else if (mode === 'mo_reconciliation_detail') {
    rightColumn = (
      <TradeReconciliationForm form={form} updateField={updateField} setMode={setMode} />
    );
  } else if (mode === 'mo_reconciliation_review') {
    rightColumn = (
      <TradeReconciliationReview moReconciliationRows={moReconciliationRows} moReconciliationCommentRows={moReconciliationCommentRows} form={form} setMode={setMode} persistTradeAndReturn={persistTradeAndReturn} returnToFo={returnToFo} />
    );
  } else if (mode === 'counterparty_form') {
    rightColumn = (
      <TradeCounterpartyForm form={form} updateField={updateField} setMode={setMode} />
    );
  } else if (mode === 'counterparty_review') {
    rightColumn = (
      <TradeCounterpartyReview counterpartyRows={counterpartyRows} counterpartyCommentRows={counterpartyCommentRows} form={form} setMode={setMode} persistTradeAndContinue={persistTradeAndContinue} returnToFo={returnToFo} />
    );
  } else if (mode === 'settlement_form') {
    rightColumn = (
      <TradeSettlementForm showReviewerCommentTile={showReviewerCommentTile} reviewerComment={reviewerComment} form={form} updateField={updateField} formatMoney={formatMoney} setMode={setMode} instrumentCurrency={instrumentInfo.currency} />
    );
  } else if (mode === 'settlement_review') {
    rightColumn = (
      <TradeSettlementReview settlementRows={settlementRows} counterpartyCommentRows={counterpartyCommentRows} setMode={setMode} persistTradeAndReturn={persistTradeAndReturn} />
    );
  } else if (mode === 'bo_approval_detail') {
    rightColumn = (
      <TradeBoCheckerForm form={form} updateField={updateField} setMode={setMode} />
    );
  } else if (mode === 'bo_approval_review') {
    rightColumn = (
      <TradeBoCheckerReview boApprovalRows={boApprovalRows} boApprovalCommentRows={boApprovalCommentRows} form={form} setMode={setMode} persistTradeAndReturn={persistTradeAndReturn} rejectSettlement={rejectSettlement} />
    );
  } else if (mode === 'mo_settlement_confirmation_detail') {
    rightColumn = (
      <TradeSettlementApprovalPanel form={form} updateField={updateField} returnToBo={returnToBo} persistTradeAndReturn={persistTradeAndReturn} />
    );
  } else if (showReviewerCommentTile) {
    rightColumn = (
      <TradeReviewerPanel reviewerComment={reviewerComment} form={form} />
    );
  }

  return (
    <PageScreen breadcrumbs={[{ label: 'Treasury' }, { label: 'Security trades', href: 'Security Trades.html' }, { label: title }]} user="treasury.demo@plata.local">
      <PageWorkspace padding={OUTER_PAD}>
        <FlowStageLayout
          navWidth={STEPPER_W}
          mainWidth={CONTENT_W}
          sideWidth={hasRightColumn ? CONTENT_W : undefined}
          nav={
            <AuraStepper
              steps={stepperSteps}
              activeAnchor={activeStepAnchor}
              onStepClick={handleStepClick}
              hideNumbers={true}
              fillHeight={true}
              disableAutoScroll={true}
            />
          }
          main={
            <IslandColumn
              colRef={scrollRef}
              scrollChildren={middleSections}
              fillMode={middleFillMode}
              buttons={middleButtons}
            />
          }
          side={rightColumn}
          header={(totalWidth) => (
            <FormPageHeader
              title={title}
              status={status}
              statusVariant={statusVariant}
              onBack={onBack}
              width={totalWidth}
              actions={headerActions}
            />
          )}
        />
      </PageWorkspace>
    </PageScreen>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
